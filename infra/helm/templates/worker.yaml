{{- $name := include "mia.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "mia.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Always one, and never two during a rollout: startup crash recovery
  # releases stale arq locks, which is only safe with a single worker (D-25).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mia.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mia.selector" (list . "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "mia.podSecurity" . | nindent 6 }}
      {{- if or .Values.serviceAccount.annotations .Values.podLabels }}
      serviceAccountName: {{ $name }}
      {{- end }}
      # On SIGTERM arq cancels running jobs; they stay "running" and resume
      # from their checkpoint when the next worker starts (D-26).
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["arq", "app.jobs.worker.WorkerSettings"]
          {{- include "mia.env" (list . "worker") | nindent 10 }}
          {{- include "mia.containerSecurity" . | nindent 10 }}
          {{- include "mia.volumeMounts" . | nindent 10 }}
          # arq refreshes a health key in Redis every 30 s; no key = the worker
          # loop is stuck or gone. (The probe doesn't import the app: cheap.)
          startupProbe:
            exec: {command: ["python", "-m", "app.healthcheck"]}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec: {command: ["python", "-m", "app.healthcheck"]}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- include "mia.volumes" . | nindent 6 }}
