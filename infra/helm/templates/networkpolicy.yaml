{{- if .Values.networkPolicy.enabled }}
{{- /* Who may talk to whom inside the release. Ingress only; egress stays
     open (Azure OpenAI, Search, Blob, Key Vault, Tavily, Langfuse, Entra).
     The news server has no auth of its own and spends the Tavily quota, so
     only the worker may reach it. */}}
{{- $ := . -}}
{{- $rules := list (dict "target" "api" "port" 8000 "from" (list)) }}
{{- if .Values.news.enabled }}
{{- $rules = append $rules (dict "target" "news" "port" (int .Values.news.port) "from" (list "worker")) }}
{{- end }}
{{- if .Values.postgres.enabled }}
{{- $rules = append $rules (dict "target" "postgres" "port" 5432 "from" (list "api" "worker")) }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $rules = append $rules (dict "target" "redis" "port" 6379 "from" (list "api" "worker")) }}
{{- end }}
{{- if .Values.ui.enabled }}
{{- $rules = append $rules (dict "target" "ui" "port" (int .Values.ui.port) "from" (list)) }}
{{- end }}
{{- range $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mia.fullname" $ }}-{{ .target }}
  labels:
    {{- include "mia.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mia.selector" (list $ .target) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .port }}
      {{- if .from }}
      from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              {{- include "mia.selector" (list $ .) | nindent 14 }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
