# CI eval gate: `uv run python -m evals.run --smoke` runs these 5 questions
# with the production retrieval mode (RETRIEVAL_MODE, now hybrid_semantic) and
# exits non-zero if either metric falls below its threshold.
smoke_ids: [q002, q012, q014, q023, q029]  # factual x2, comparative, temporal, unanswerable

# Measurements behind the values:
#   Day 13, vector:           faithfulness 1.00 in 4/4 runs; citation validity
#                             1.00, 1.00, 1.00, 0.857 (one malformed id,
#                             "microsoft-annual-report-208" for "...-10k-208").
#   Day 14, hybrid_semantic:  faithfulness 1.00 and citation validity 1.00 in
#                             4/4 runs (3 smoke runs + the benchmark's smoke
#                             subset); 0 semantic-ranker fallbacks.
#
# faithfulness: 10% below the measured 1.00.
faithfulness: 0.90
# citation_validity: the smoke set yields ~8 citations, so a single malformed
# id costs 12-14 points. 0.80 tolerates one slip (normal variance, seen on
# Day 13) and fails on two. "10% below 1.00" (0.90) would trip on one.
citation_validity: 0.80
