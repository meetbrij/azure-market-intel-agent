# Golden set: 30 questions over the indexed 10-Ks.
#
# Written from the filing text, not generated by the model under evaluation
# (gpt-5-mini): every ground truth is taken from the page listed in
# expected_pages, so each entry can be checked against the PDF.
#
# Mix (docs/PHASE3_SPEC.md, Day 13), adapted to an annual-only corpus:
#   12 factual      single-document facts
#    8 comparative  company A vs B on one metric
#    5 temporal     change between fiscal years (the corpus has no 10-Qs)
#    5 unanswerable genuinely absent from the corpus — verified by searching
#                   all three filings. The system must decline, not guess.
#
# companies: the filter a user would pick in the UI; the retriever gets it,
#            as the API does. Empty = search the whole index.
# Amounts in "$X million" are as tabulated in the filing (in millions).

- id: q001
  question: "How many employees did Amazon have as of December 31, 2025?"
  ground_truth: "Approximately 1,576,000 full-time and part-time employees as of December 31, 2025."
  expected_sources: ["amzn_annual_report_10k.pdf"]
  expected_pages: [4]
  companies: [Amazon]
  category: factual
  answerable: true

- id: q002
  question: "What were Amazon Web Services (AWS) net sales in 2025?"
  ground_truth: "AWS net sales were $128,725 million in 2025 (up from $107,556 million in 2024)."
